<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hostel Shopping Mart</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <header>
        <div class="container">
            <h1>🛒 Hostel Shopping Mart</h1>
            <a href="admin.html" class="admin-link">admin</a>
        </div>
    </header>

    <main class="container">
        <div class="shopping-container">
            <!-- Products Section -->
            <section class="products-section">
                <h2>Our Products</h2>
                <div id="products-grid" class="products-grid">
                    <div class="loading">Loading products...</div>
                </div>
            </section>

            <!-- Cart Sidebar -->
            <aside class="cart-sidebar" id="cart-sidebar">
                <div class="cart-header">
                    <h2>Your Cart</h2>
                    <button class="close-cart" id="close-cart">&times;</button>
                </div>
                <div class="cart-items" id="cart-items">
                    <p class="empty-cart">Your cart is empty</p>
                </div>
                <div class="cart-footer">
                    <div class="cart-total">
                        <strong>Total: ₹<span id="cart-total">0</span></strong>
                    </div>
                    <button class="btn-checkout" id="checkout-btn" disabled>Checkout</button>
                </div>
            </aside>

            <!-- Cart Button (Floating) -->
            <button class="cart-button" id="cart-button">
                🛒 Cart (<span id="cart-count">0</span>)
            </button>
        </div>

        <!-- Checkout Modal -->
        <div class="modal" id="checkout-modal">
            <div class="modal-content">
                <span class="close-modal" id="close-modal">&times;</span>
                <h2>Place Your Order</h2>
                <form id="checkout-form">
                    <div class="form-group">
                        <label for="customer-name">Full Name *</label>
                        <input type="text" id="customer-name" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-email">Email Address *</label>
                        <input type="email" id="customer-email" required>
                    </div>
                    <div class="form-group">
                        <label for="customer-mobile">Mobile Number *</label>
                        <input type="tel" id="customer-mobile" required>
                    </div>
                    <div class="form-group">
                        <label for="hostel-no">Hostel No *</label>
                        <select id="hostel-no" required>
                            <option value="" disabled selected>Select Hostel</option>
                            <option value="1">Hostel 1</option>
                            <option value="2" disabled>Hostel 2 (Unavailable)</option>
                            <option value="3" disabled>Hostel 3 (Unavailable)</option>
                            <option value="4" disabled>Hostel 4 (Unavailable)</option>
                        </select>
                    </div>
                    <div class="order-summary" id="order-summary"></div>
                    <div class="form-actions">
                        <button type="button" class="btn-cancel" id="cancel-checkout">Cancel</button>
                        <button type="submit" class="btn-submit">Place Order</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Success/Error Messages -->
        <div class="toast" id="toast"></div>
    </main>

    <!-- Firebase SDK v8 -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

    <!-- Firebase Config -->
    <script src="js/firebase-config.js"></script>
    <script src="js/google-sheet-config.js"></script>

    <!-- App Scripts -->
    <script src="js/app.js"></script>
</body>

</html>
